<meta name="theme-color" content="#176B45">

<body data-page="track" data-root="../">
<a class="skip-link" href="#main">Skip to content</a>
<div id="site-header"></div>
<main id="main">
<section class="page-head"><div class="container"><h1>Track your order</h1><p>Enter your order reference to see where your order is.</p></div></section>
<section class="section"><div class="container narrow">
<form id="track-form" class="form-card" novalidate>
  <div class="field"><label for="track-ref">Order reference</label><input id="track-ref" type="text" placeholder="e.g. HB-1001" autocomplete="off" aria-describedby="err-ref"><p class="field-error" id="err-ref" role="alert"></p></div>
  <button type="submit" class="btn btn-primary btn-block">Check status</button>
  <p class="note">Status updates are shown for orders placed on this device. For anything else, message us on WhatsApp with your reference.</p>
  <a class="btn btn-whatsapp" data-wa="contact" href="#">Message us on WhatsApp</a>
</form>
<div id="track-result" aria-live="polite"></div>
</div></section>
</main>
<div id="site-footer"></div>
